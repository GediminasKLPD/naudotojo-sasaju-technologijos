<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      <h1 class="h3 mb-4 text-center">BMI Calculator</h1>

      <div class="card shadow-sm">
        <div class="card-body">
          <form (ngSubmit)="calculate()">
            <div class="mb-3">
              <label for="weight" class="form-label">Weight (kg)</label>
              <input
                id="weight"
                name="weight"
                type="number"
                step="0.1"
                class="form-control"
                placeholder="e.g. 70"
                [(ngModel)]="weight">
            </div>

            <div class="mb-3">
              <label for="height" class="form-label">Height (cm)</label>
              <input
                id="height"
                name="height"
                type="number"
                step="1"
                class="form-control"
                placeholder="e.g. 180"
                [(ngModel)]="height">
            </div>

            <button type="submit" class="btn btn-primary w-100">Calculate</button>
          </form>

          @if (error()) {
            <div class="alert alert-warning mt-3 mb-0">{{ error() }}</div>
          }

          @if (bmi() !== null) {
            <div class="alert alert-success text-center mt-3 mb-0">
              <div class="small text-uppercase">Your BMI</div>
              <div class="display-5 fw-bold">{{ bmi() | number:'1.2-2' }}</div>
              <div>{{ category(bmi()!) }}</div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</main>
